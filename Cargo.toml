[package]
name = "ciris-node-core"
version = "0.1.0-dev"
edition = "2021"
description = "Second-tier consensus runtime for the CIRIS federation: contributions, votes, expertise/credits ledgers, moderation, slashing, reconsideration"
license = "AGPL-3.0-or-later"
authors = ["CIRIS Team"]
repository = "https://github.com/CIRISAI/CIRISNodeCore"

[lib]
name = "ciris_node_core"
# `rlib` for the post-fold-into-agent trajectory (MISSION.md §1.4 lifecycle:
# Spec → Impl → Deployed pilot → Deployed folded). `cdylib` so safety.ciris.ai
# can consume via PyO3 during the pilot window.
crate-type = ["cdylib", "rlib"]

[dependencies]
# Substrate. Persist v2.1.0 — the "Federation Ready" line convergence
# point (per CIRISAgent/requirements.txt: ciris-persist>=2.0.7,<3.0.0,
# ciris-verify>=3.0.1,<4.0.0; agent comment: "All three in-process
# consumers (agent + CIRISNodeCore + CIRISLensCore) link this identical
# pin"). Bumped from v1.12.0 → v2.1.0 alongside the Federation
# Announcement primitive landing (FSD/FEDERATION_ANNOUNCEMENT.md); the
# 2.0.x line carries the federation-surface concurrency-hardening
# (advisory-lock pattern, V045 UNIQUE constraint, CIRISPersist#95
# closing CIRISEdge#16) that the new primitive's mandatory-delivery
# audit path needs.
#
# Pins CIRISVerify v3.0.1 transitively — the bootstrap key trust
# anchor (FSD/FEDERATION_ANNOUNCEMENT.md §4) shares
# canonical-hash discipline with verify's CanonicalBuild v2 wire
# format on POST /v1/builds.
#
# `postgres` feature preserved: the `cirisnode` feature was decoupled
# from backends at v1.11.0; `NodeCoreDispatch::Postgres` is what
# `crate::cohabitation::install_from_dispatch` matches.
ciris-persist = { git = "https://github.com/CIRISAI/CIRISPersist", tag = "v2.1.0", version = "2", features = ["cirisnode", "cirisaudit", "postgres"] }

# Edge v0.5.1 — latest on the v0.5.x line; carries persist v2.x +
# verify v3.x. Consumed surface (`src/messages/`, `src/handler.rs`,
# `src/edge.rs`) byte-stable v0.2.5 → v0.5.1; v0.5.x adds the
# substrate hooks the Federation Announcement primitive needs for
# Mandatory-delivery / subscription-bypass MessageType (tracked: this
# repo's FSD/FEDERATION_ANNOUNCEMENT.md §3.2).
#
# NOTE: edge's PyO3 `Edge` class status — re-check at v0.5.1; if
# still stub, the cohabitation `#[pyfunction]`
# (crate::cohabitation, agent-runtime entry point) remains blocked.
# Tracked: CIRISEdge#16.
#
# DEPLOYMENT NOTE: persist's ciris-keyring `tpm` feature
# unification still forces system `libtss2` (`libtss2-dev` for
# builds) onto every co-resident Linux build / host. See
# CIRISEdge#12.
ciris-edge = { git = "https://github.com/CIRISAI/CIRISEdge", tag = "v0.5.1", version = "0" }

# Serde + canonicalization. Canonicalization itself routes through
# persist's `Engine.canonicalize_envelope_for_signing` — see
# FSD/SUBSTRATE_INTEGRATION.md §3. Node-core never re-canonicalizes.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Crypto. Ed25519 verification lives in edge/persist; node-core only
# uses it for type signatures on its wire envelopes. ML-DSA-65 PQC
# half of the hybrid signature is opaque to node-core (persist owns it).
ed25519-dalek = { version = "2.1", features = ["std"] }
base64 = "0.21"
sha2 = "0.10"

# Identifiers + time. ULID for `contribution_id`, `vote_id`, etc.
# per SCHEMA.md §2.2.
ulid = { version = "1.1", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Async + observability
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"

# Error handling
thiserror = "1.0"
async-trait = "0.1"

# PyO3 — Phase 1 client-surface bindings (CIRISNodeCore#1). Optional;
# gated behind the `python` feature. v0.28 + abi3-py311 matches
# `ciris-persist` + `ciris-lens-core` exactly — required for CIRIS 3.0
# in-process cohabitation (all co-resident cdylibs must link one
# identical pyo3 ABI).
pyo3 = { version = "0.28", features = ["extension-module", "abi3-py311"], optional = true }

[dev-dependencies]
proptest = "1.4"
uuid = { version = "1", features = ["v4"] }

[features]
default = []

# PyO3 cdylib bindings. Phase 1 = the client surface (envelope
# construction + Ed25519 signing — pure, no engine). Per
# CIRISNodeCore#4 the bindings NEVER construct a persist Engine or a
# tokio runtime; Phase 1 has no engine to inject. Phases 2-3
# (relay/node modes that host substrate) consume an injected persist
# Engine handle — gated on a persist coordination item, not in this
# feature yet.
python = ["dep:pyo3"]

# Sqlite backend support for the cohabitation bootstrap. Persist v2.x
# feature-gates `NodeCoreDispatch::Sqlite` behind its own `sqlite`
# feature (CIRISPersist `engine.rs:497-508`); to keep the cohabitation
# match arm exhaustive when the host's Engine is Sqlite-backed,
# node-core forwards a parallel `sqlite` feature that activates
# persist's. The default cohabitation target is Postgres (the
# safety.ciris.ai shape per MISSION §7.3); Sqlite is opt-in for
# embedded / Pi-class deployments. NodeCore#6.
sqlite = ["ciris-persist/sqlite"]
