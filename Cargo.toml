[package]
name = "ciris-node-core"
version = "0.1.0-dev"
edition = "2021"
description = "Second-tier consensus runtime for the CIRIS federation: contributions, votes, expertise/credits ledgers, moderation, slashing, reconsideration"
license = "AGPL-3.0-or-later"
authors = ["CIRIS Team"]
repository = "https://github.com/CIRISAI/CIRISNodeCore"

[lib]
name = "ciris_node_core"
# `rlib` for the post-fold-into-agent trajectory (MISSION.md §1.4 lifecycle:
# Spec → Impl → Deployed pilot → Deployed folded). `cdylib` so safety.ciris.ai
# can consume via PyO3 during the pilot window.
crate-type = ["cdylib", "rlib"]

[dependencies]
# Substrate. Persist v0.7.0-α3 (commit 5f884a4) ships the
# federation-consensus surface from Appendix A of FSD/CIRIS_PERSIST.md:
# wire types (ContributionEnvelope, VoteEnvelope, ledger types, ...) +
# `NodeCoreService` trait (8 typed-writes + 5 read clusters). Pinned by
# rev rather than tag because v0.7.0 release is mid-flight (α4-α6 to
# follow: PostgresBackend impl, Engine PyO3 wraps, release tag).
#
# Gated behind persist's `cirisnode` feature which transitively
# requires `postgres` (the backend impl lands in α4 and reads from
# the cirisnode.* PG schema established by V011).
ciris-persist = { git = "https://github.com/CIRISAI/CIRISPersist", rev = "5f884a4", version = "0", features = ["cirisnode"] }

# Edge v0.1.2 (2026-05-12) ships the 8 federation-consensus
# MessageType variants from CIRISEdge#6 — ContributionSubmit, VoteCast,
# ExpertiseAttestationPublish, ModerationEventPublish,
# SlashingAttestationPublish, ReconsiderationRequest, DeferralRequest,
# DeferralResponse — alongside persist v0.6.0 + verify v2.0.2.
# Node-core registers handlers via
# `edge.register_handler::<ContributionSubmit, _>(...)` etc. per
# `FSD/SUBSTRATE_INTEGRATION.md` §3.
ciris-edge = { git = "https://github.com/CIRISAI/CIRISEdge", tag = "v0.1.2", version = "0" }

# Serde + canonicalization. Canonicalization itself routes through
# persist's `Engine.canonicalize_envelope_for_signing` — see
# FSD/SUBSTRATE_INTEGRATION.md §3. Node-core never re-canonicalizes.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Crypto. Ed25519 verification lives in edge/persist; node-core only
# uses it for type signatures on its wire envelopes. ML-DSA-65 PQC
# half of the hybrid signature is opaque to node-core (persist owns it).
ed25519-dalek = { version = "2.1", features = ["std"] }
base64 = "0.21"
sha2 = "0.10"

# Identifiers + time. ULID for `contribution_id`, `vote_id`, etc.
# per SCHEMA.md §2.2.
ulid = { version = "1.1", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Async + observability
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"

# Error handling
thiserror = "1.0"
async-trait = "0.1"

[dev-dependencies]
proptest = "1.4"

[features]
default = []

# PyO3 cdylib for safety.ciris.ai pilot integration during the
# Spec → Impl → Deployed-pilot window of MISSION.md §1.4.
# Pulled in by deployments that consume via Python; defaults off for
# the post-fold-into-agent trajectory.
# python = ["dep:pyo3"]  # uncomment when pyo3 dep + bindings land
