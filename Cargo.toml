[package]
name = "ciris-node-core"
version = "0.1.0-dev"
edition = "2021"
description = "Second-tier consensus runtime for the CIRIS federation: contributions, votes, expertise/credits ledgers, moderation, slashing, reconsideration"
license = "AGPL-3.0-or-later"
authors = ["CIRIS Team"]
repository = "https://github.com/CIRISAI/CIRISNodeCore"

[lib]
name = "ciris_node_core"
# `rlib` for the post-fold-into-agent trajectory (MISSION.md §1.4 lifecycle:
# Spec → Impl → Deployed pilot → Deployed folded). `cdylib` so safety.ciris.ai
# can consume via PyO3 during the pilot window.
crate-type = ["cdylib", "rlib"]

[dependencies]
# Substrate — the CIRIS 3.0 in-process cohabitation triple.
#
# persist v3.1.1 + edge v0.13.1 (transitively pins verify v4.0.0).
# This is the production triple consumed by the agent + node-core +
# lens-core in one process; matching is required for feature
# unification + PyO3 ABI alignment (all co-resident cdylibs link one
# `pyo3` ABI).
#
# Persist v3 surface in use:
#  - `NodeCoreDispatch` (postgres / sqlite) → `cohabitation::install_from_dispatch`
#  - `BackendDispatch`  (postgres / sqlite) → `serving::install_from_dispatch`
#  - PyCapsule accessors: blob_storage_capsule / runtime_handle_capsule /
#    federation_directory_capsule / outbound_queue_capsule /
#    keyring_signer_capsule / local_signer_capsule
#
# `postgres` feature explicit; `sqlite` reaches us transitively via
# edge v0.13.1's pin `ciris-persist = { ..., features = ["sqlite"] }`.
# Our local `sqlite` feature is retained for symmetry but is
# effectively no-op (the variant is always present via unification).
#
# DEPLOYMENT NOTE: persist's ciris-keyring `tpm` feature unification
# still forces system `libtss2` (`libtss2-dev` for builds) onto every
# co-resident Linux build / host. See CIRISEdge#12.
ciris-persist = { git = "https://github.com/CIRISAI/CIRISPersist", tag = "v3.3.0", version = "3", features = ["cirisnode", "cirisaudit", "postgres", "sqlite"] }

# Edge v0.13.1 — cohabitation triple anchor. Consumed surface:
#  - `Edge` runtime + `MessageType` registry (federation-consensus
#    handlers register here from `crate::cohabitation::install`)
#  - PyO3: `PyEdge` with `edge_handle()` Rust-tier `Arc<Edge>` accessor
#    (unblocks the `#[pyfunction]` form of cohabitation install)
#  - `init_edge_runtime(engine: Bound<'_, PyAny>)` injection pattern
ciris-edge = { git = "https://github.com/CIRISAI/CIRISEdge", tag = "v0.17.1", version = "0" }

# Serde + canonicalization. Canonicalization itself routes through
# persist's `Engine.canonicalize_envelope_for_signing` — see
# FSD/SUBSTRATE_INTEGRATION.md §3. Node-core never re-canonicalizes.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Crypto. Ed25519 verification lives in edge/persist; node-core only
# uses it for type signatures on its wire envelopes. ML-DSA-65 PQC
# half of the hybrid signature is opaque to node-core (persist owns it).
ed25519-dalek = { version = "2.1", features = ["std"] }
base64 = "0.21"
sha2 = "0.10"

# Identifiers + time. ULID for `contribution_id`, `vote_id`, etc.
# per SCHEMA.md §2.2. UUID v4 for `attestation_id` on holds_bytes
# emission via persist's `put_blob_signing` (CIRISPersist#121).
ulid = { version = "1.1", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

# Async + observability
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"

# Error handling
thiserror = "1.0"
async-trait = "0.1"

# PyO3 — gates the Phase 1 client surface (CIRISNodeCore#1) +
# the Phase 3 cohabitation install (CIRISNodeCore#11). Optional;
# enabled by the `python` feature.
#
# `abi3-py310` aligns with the cohabitation triple — persist v3.1.1
# and edge v0.13.1 both pin `abi3-py310`. All co-resident cdylibs MUST
# link one identical pyo3 ABI for CIRIS 3.0 in-process cohabitation.
# abi3 is forward-compatible: a py310-tagged wheel runs on 3.11/3.12+.
pyo3 = { version = "0.28", features = ["extension-module", "abi3-py310"], optional = true }

[dev-dependencies]
proptest = "1.4"
uuid = { version = "1", features = ["v4"] }
# ciris-keyring is reached via the BlobStorage trait surface
# (evict_actor takes `&dyn ciris_keyring::HardwareSigner`); only the
# in-memory test mocks need it directly.
ciris-keyring = { git = "https://github.com/CIRISAI/CIRISVerify", tag = "v4.3.0", version = "4" }

[features]
default = []

# PyO3 cdylib bindings.
#
# * Phase 1 — client surface (envelope construction + Ed25519
#   signing — pure, no engine).
# * Phase 2 — read-composition surfaces (CIRISNodeCore#12) +
#   external-content feeds (CIRISNodeCore#19). Engine is a duck-typed
#   Python object; persist's `pyo3` feature is NOT required.
# * Phase 3 — cohabitation install (CIRISNodeCore#11). Crosses a Rust
#   type boundary (`PyRef<PyEngine>` + `PyRef<PyEdge>` + plain `pub fn`
#   accessors `node_core_service` / `edge_handle`) so persist's +
#   edge's `pyo3` features are required.
#
# Per CIRISNodeCore#4 the bindings NEVER construct a persist Engine
# or a tokio runtime — Phase 3 calls `current_runtime_handle()` to
# borrow the persist-owned runtime for the install bridge.
python = ["dep:pyo3", "ciris-persist/pyo3", "ciris-edge/pyo3"]

# Sqlite backend support for the cohabitation bootstrap. Effectively
# no-op at the v0.13.1 cohabitation triple — edge transitively enables
# `ciris-persist/sqlite`, so the `Sqlite` variants of `BackendDispatch`
# / `NodeCoreDispatch` are always present in our build. The feature is
# retained for explicit-opt-in symmetry with persist's gating
# (CIRISPersist `engine.rs:497-508`) and as forward-compatibility if
# edge's pin ever decouples sqlite. NodeCore#6.
sqlite = ["ciris-persist/sqlite"]

# v3.3.0 (CIRISPersist#121) ships `put_blob_signing` which closes the
# JCS-vs-Python canonicalizer-identity trap for NodeCore Phase 2B
# holds_bytes ingest. Edge v0.17.1 still pins persist v3.2.0
# transitively; this patch unifies the whole dep graph onto v3.3.0 so
# the cohabitation singletons (engine_slot, blob_storage_capsule, …)
# are one set, not two. v3.2.0 → v3.3.0 is additive (a default-impl
# trait method); no breaking surface for edge to recompile against.
#
# Path patch convention: Cargo refuses git-source patches that share
# the original URL (`patches must point to different sources`); the
# canonical local-dev workaround is a path patch against the sibling
# checkout. Until edge cuts a release with persist v3.3.0, this
# repo expects ~/CIRISPersist checked out at v3.3.0 (commit baad6bf).
[patch."https://github.com/CIRISAI/CIRISPersist"]
ciris-persist = { path = "/home/emoore/CIRISPersist" }
